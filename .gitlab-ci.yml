# GitLab pipeline — Next.js component from the DevOps catalog

include:
  - component: $CI_SERVER_HOST/DevOps-Templates/ci-cd-devops-catalog/devops-next-comp@~latest
    inputs:
      gitlab-runner: "k8s"
      node-image: "$NEXUS_REGISTRY_PULL_URL/node:24.21.0-alpine"
      build-command: "build"
      build-artifact-path: ".next"
      unit-tests-enabled: "false"
      sonar-enabled: "false"
      accessibility-enabled: "false"
      docker-image-name: "$CI_PROJECT_NAME"
      dockerfile-dev: ".gitlab/docker/Dockerfile"
      dockerfile-tst: ".gitlab/docker/Dockerfile"
      dockerfile-ppr: ".gitlab/docker/Dockerfile"
      dockerfile-prd: ".gitlab/docker/Dockerfile"
      release-token: "$RELEASE_TOKEN"

promote-to-dev-environment:
  rules:
    - when: never

promote-to-tst-environment:
  rules:
    - when: never

promote-to-ppr-environment:
  rules:
    - when: never

promote-to-prd-environment:
  rules:
    - when: never
